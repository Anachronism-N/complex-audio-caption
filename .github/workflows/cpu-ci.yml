name: CPU CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,audio]"
      - name: Ruff
        run: ruff check .
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Test
        run: pytest
