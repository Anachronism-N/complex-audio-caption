# INVALIDATED historical config. The canonical formatter re-sorted shuffled
# events, so the reported run changed 0/500 targets and was not permutation
# invariant. The trainer now rejects shuffle_events instead of silently running
# another sample-order variant. Do not use this config for paper experiments.
model:
  path: /tmp/moss_weights
  device: cuda:0
  dtype: bfloat16
  freeze_audio_encoder: true
  freeze_base_llm: true

lora:
  rank: 128
  alpha: 256
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

data:
  manifest_path: data/derived/b3_unified/manifest.jsonl
  audio_base_dir: /tmp/b3_unified
  sample_rate: 16000
  max_audio_seconds: 30.0
  style: brief
  target_mode: atomic
  group_key: source_id
  val_fraction: 0.1
  include_lyrics: true

train:
  steps: 1000
  global_effective_batch: 8
  micro_batch_size: 1
  learning_rate: 5.0e-5
  schedule: cosine
  warmup_steps: 50
  weight_decay: 0.0
  max_grad_norm: 1.0
  gradient_checkpointing: true
  seed: 20260808
  output_dir: outputs/b3_permuted
  shuffle_events: true          # KEY: shuffle event order in target

loss:
  text_weight: 1.0
  type_weight: 2.0
  timestamp_weight: 5.0
