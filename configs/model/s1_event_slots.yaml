# S1a-valid: event-only slot decoder (no caption text or track prediction).
# Uses the exact leakage-safe folds produced by scripts/run_b3_valid.sh.

model:
  path: /tmp/moss_weights
  device: cuda:0
  dtype: bfloat16
  hidden_dim: 768
  n_slots: 24
  n_heads: 8
  n_layers: 4
  use_temporal_embedding: true

data:
  train_manifest_path: runs/b3_valid/sft/train_manifest.jsonl
  val_manifest_path: runs/b3_valid/sft/val_manifest.jsonl
  audio_base_dir: runs/b3_valid/data
  feature_cache: runs/s1_valid/features
  group_key: source_id
  max_audio_seconds: 30.0

train:
  steps: 10000
  learning_rate: 1.0e-4
  weight_decay: 0.01
  max_grad_norm: 1.0
  warmup_steps: 500
  eval_every: 500
  log_every: 100
  deterministic: true
  # Split only the B3-valid training fold; the original val fold stays untouched.
  calibration_fraction: 0.1
  seed: 20260808
  output_dir: runs/s1_valid/model

loss:
  eventness_weight: 1.0
  type_weight: 1.0
  activity_weight: 2.0
  boundary_weight: 1.0
  activity_cost_weight: 2.0
  boundary_cost_weight: 1.0
  positive_weight_scale: 1.0
  max_positive_weight: 20.0

evaluation:
  # Fixed before the validation run; do not tune these on the reported fold.
  eventness_threshold: 0.5
  activity_threshold: 0.5
  tiou_threshold: 0.3
  primary_decode_mode: hybrid
  decode_modes: [activity, boundary, hybrid]
  # Selected by calibration micro event-F1, never by conditional boundary MAE.
  calibration_thresholds: [0.10, 0.20, 0.30, 0.40, 0.50, 0.60]
