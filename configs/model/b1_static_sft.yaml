# B1: static SFT on TAC-mini (ordinary token CE).
# Goal: teach MOSS-Audio-4B the canonical atomic-token caption format.
# B0 baseline: format-success=0%, event-F1=0. B1 target: format-success>=99%.

model:
  path: /tmp/moss_weights
  device: cuda:0
  dtype: bfloat16
  freeze_audio_encoder: true
  freeze_base_llm: true

lora:
  rank: 128
  alpha: 256
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  # audio encoder is NOT LoRA-adapted in B1 (frozen entirely)

data:
  manifest_path: data/derived/tac_mini/manifest.jsonl
  audio_base_dir: /tmp/tac_mini
  sample_rate: 16000              # MOSS mel_sr
  max_audio_seconds: 30.0
  style: brief
  target_mode: atomic             # "atomic" (B1/B2) | "xml" (B1-xml variant)
  group_key: source_id
  val_fraction: 0.1

train:
  steps: 1000                     # 500 clips × 2 epochs at effective batch 1
  global_effective_batch: 8       # gradient accumulation
  micro_batch_size: 1             # 4B model + 30s audio -> batch 1 per GPU
  learning_rate: 5.0e-5
  schedule: cosine
  warmup_steps: 50
  weight_decay: 0.0
  max_grad_norm: 1.0
  gradient_checkpointing: true
  seed: 20260808

loss:
  text_weight: 1.0
  type_weight: 1.0                # B1: uniform; B2 sets timestamp_weight=5.0
  timestamp_weight: 1.0           # B1 = ordinary CE; B2 = 5.0

eval:
  run_after_training: true
  eval_split: val
  output_dir: outputs/b1_static_sft
