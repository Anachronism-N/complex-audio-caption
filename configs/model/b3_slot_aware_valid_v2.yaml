# First model anchor after b3_complex_v2 passes its data gate.
model:
  path: /tmp/moss_weights
  device: cuda:0
  dtype: bfloat16
  freeze_audio_encoder: true
  freeze_base_llm: true

lora:
  rank: 128
  alpha: 256
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

data:
  manifest_path: data/derived/b3_complex_v2/train/manifest.jsonl
  audio_base_dir: data/derived/b3_complex_v2/train
  split_contract_path: data/derived/b3_complex_v2/gate/split_contract.json
  data_gate_summary_path: data/derived/b3_complex_v2/gate/experiment_data_summary.json
  expected_split: train
  pre_split: true
  sample_rate: 16000
  max_audio_seconds: 30.0
  style: brief
  target_mode: atomic
  include_lyrics: true
  slot_aware: true

train:
  steps: 3000
  global_effective_batch: 8
  micro_batch_size: 1
  learning_rate: 5.0e-5
  schedule: cosine
  warmup_steps: 100
  weight_decay: 0.0
  max_grad_norm: 1.0
  gradient_checkpointing: true
  seed: 20260808
  output_dir: outputs/b3_slot_aware_valid_v2
  shuffle_events: true

loss:
  text_weight: 1.0
  type_weight: 2.0
  timestamp_weight: 5.0
