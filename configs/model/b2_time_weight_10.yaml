# B2 ablation: timestamp_weight=10 (vs B2's 5.0, B1's 1.0).
# Question: does even stronger temporal weighting help or hurt?
model:
  path: /tmp/moss_weights
  device: cuda:1              # parallel to B2 inference on cuda:0
  dtype: bfloat16
  freeze_audio_encoder: true
  freeze_base_llm: true

lora:
  rank: 128
  alpha: 256
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

data:
  manifest_path: data/derived/tac_mini/manifest.jsonl
  audio_base_dir: /tmp/tac_mini
  sample_rate: 16000
  max_audio_seconds: 30.0
  style: brief
  target_mode: atomic
  group_key: source_id
  val_fraction: 0.1

train:
  steps: 1000
  global_effective_batch: 8
  micro_batch_size: 1
  learning_rate: 5.0e-5
  schedule: cosine
  warmup_steps: 50
  weight_decay: 0.0
  max_grad_norm: 1.0
  gradient_checkpointing: true
  seed: 20260808
  output_dir: outputs/b2_time_weight_10

loss:
  text_weight: 1.0
  type_weight: 2.0
  timestamp_weight: 10.0       # ablation: 2x the B2 weight
