# Copy this file per fold and point catalog_path at train.jsonl, val.jsonl or test.jsonl.
# Never sample all.jsonl and split rendered mixtures afterwards.
pool:
  kind: catalog
  catalog_path: /data/sceneledger/sources/catalogs/train.jsonl
  audio_root: /data/sceneledger/sources/audio
  audit_report_path: /data/sceneledger/sources/catalogs/source_audit_report.json
  expected_split: train

sampler:
  sample_rate: 24000
  duration_range: [10.0, 30.0]
  gain_db_range: [-12.0, 3.0]
  fg_bg_snr_range: [-10.0, 20.0]
  t60_range: [0.1, 1.2]
  echo_delay_ms_range: [80, 500]
  echo_atten_db_range: [-18.0, -3.0]
  repeat_range: [1, 5]
  merge_threshold_range: [0.1, 1.0]
  resolutions: [0.1]
  styles: [detailed]
  loop_background_to_scene: true
  enforce_speaker_overlap: true
  dense_repeated_event: true
  spread_repeated_event: true
  stable_unique_source_ids: true
  ducking_probability: 0.7
  ducking_depth_db_range: [2.0, 5.0]
  p_rir: 0.5
  p_echo: 0.3

render:
  sample_count: 100
  template_weights:
    speech_over_music: 2
    music_with_sfx: 2
    speech_music_sfx: 2
    lyrics_over_music: 2
    overlapping_speakers: 2
    ambient_with_intermittent_sfx: 1
    speech_music_lyrics_sfx: 2
    complex_cocktail: 2
    rich_band: 2
    multi_event_dense: 2
  seed_base: 20260813
  template_seed: 101
  scene_id_prefix: real_train
