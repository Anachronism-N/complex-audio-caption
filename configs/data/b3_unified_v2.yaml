# B3 data v2: improved audio quality + complex templates + background fill.
# Addresses docs/15 problems 6-8: silence, complexity, ducking.
pool:
  kind: synthetic
  sample_rate: 24000
  seed: 20260808

sampler:
  sample_rate: 24000
  duration_range: [10.0, 30.0]
  gain_db_range: [-12.0, 3.0]
  fg_bg_snr_range: [-10.0, 20.0]
  t60_range: [0.1, 1.2]
  echo_delay_ms_range: [80, 500]
  echo_atten_db_range: [-18.0, -3.0]
  repeat_range: [1, 5]
  merge_threshold_range: [0.1, 1.0]
  resolutions: [0.1, 0.5, 1.0]
  styles: [keyword, brief, detailed]
  activity_threshold_range: [0.03, 0.12]
  p_rir: 0.5
  p_echo: 0.3

render:
  sample_count: 5000
  template_weights:
    # Simple (20%): 1-2 sources
    isolated_sfx: 1
    repeated_event: 1
    # Medium (50%): 2-4 sources
    speech_over_music: 2
    music_with_sfx: 2
    speech_music_sfx: 2
    lyrics_over_music: 2
    overlapping_speakers: 2
    ambient_with_intermittent_sfx: 1
    # Complex (30%): 4-6 sources
    speech_music_lyrics_sfx: 2
    complex_cocktail: 2
    rich_band: 2
    multi_event_dense: 2
  seed_base: 1947
  subgroup_count: 5
  audio_format:
    subtype: PCM_16
