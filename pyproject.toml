[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sceneledger"
version = "0.1.0"
description = "SceneLedger: evidence-first timestamped captioning of complex audio scenes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "SceneLedger contributors" }]
dependencies = [
  "pydantic>=2.6",
  "numpy>=1.24",
  "scipy>=1.10",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.2",
  "pytest-cov>=4.0",
  "ruff>=0.4",
]
moss = [
  # MOSS-Audio adapter deps are intentionally optional; pin at P1.
  "torch>=2.1",
  "torchaudio>=2.1",
  "soundfile>=0.12",
]
data = [
  "soundfile>=0.12",
]

[project.scripts]
sceneledger-evaluate = "sceneledger.cli.evaluate:main"
sceneledger-audit-result = "sceneledger.cli.audit_result:main"
sceneledger-model-review = "sceneledger.cli.model_review:main"
sceneledger-train-preflight = "sceneledger.cli.train_preflight:main"
sceneledger-audit-mixtures = "sceneledger.cli.audit_mixtures:main"
sceneledger-audit-complexity = "sceneledger.cli.audit_complexity:main"
sceneledger-validate-experiment-data = "sceneledger.cli.validate_experiment_data:main"
sceneledger-human-audit = "sceneledger.cli.human_audit:main"
sceneledger-preflight-data = "sceneledger.cli.preflight_data:main"
sceneledger-prepare-sources = "sceneledger.cli.prepare_sources:main"
sceneledger-prepare-esc50 = "sceneledger.cli.prepare_esc50:main"
sceneledger-prepare-fsd50k = "sceneledger.cli.prepare_fsd50k:main"
sceneledger-prepare-musdb18 = "sceneledger.cli.prepare_musdb18:main"
sceneledger-caption-sources = "sceneledger.cli.caption_sources:main"
sceneledger-prepare-librispeech = "sceneledger.cli.prepare_librispeech:main"
sceneledger-prepare-common-voice = "sceneledger.cli.prepare_common_voice:main"
sceneledger-prepare-slakh = "sceneledger.cli.prepare_slakh:main"
sceneledger-prepare-urbansound8k = "sceneledger.cli.prepare_urbansound8k:main"
sceneledger-validate-source-policy = "sceneledger.cli.validate_source_policy:main"
sceneledger-recipes = "sceneledger.cli.scene_recipes:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
